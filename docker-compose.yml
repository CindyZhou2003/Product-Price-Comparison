networks:
   my_network:

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - my_network

  db:
    image: mysql:8.0

    environment:
      MYSQL_HOST: localhost
      MYSQL_DATABASE: pcb
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: Sql_201208
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - my_network
    ports:
      - "3306:3306"

volumes:
  db_data:

